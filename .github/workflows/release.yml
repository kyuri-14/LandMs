name: Release

# Push a version tag (e.g. v0.3.0) to build installers for every OS and a
# draft GitHub Release with signed updater artifacts and latest.json.
# Publish the draft to make the update visible to installed apps.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Fail in seconds, not after three 15-minute builds, when the release
  # cannot produce a working update.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Signs a throwaway file and checks the signature belongs to the public
      # key in tauri.conf.json: catches a missing or mis-pasted secret, a wrong
      # password, or a key that installed apps would reject.
      - name: Update-signing key works
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/check-signing-key.mjs
      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        run: node scripts/version.mjs check "${GITHUB_REF_NAME}"

  release:
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Universal binary: runs natively on Apple Silicon and Intel.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (Tauri)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS x86_64 target (universal binary)
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Tauri rejects the key if a newline or space was pasted with it, which
      # is easy to do when copying it from a terminal. Strip both once here;
      # the build step reads the cleaned values from the job environment.
      - name: Prepare update-signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          key="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          password="$(printf '%s' "$PASSWORD" | tr -d '\r\n')"
          echo "::add-mask::$key"
          if [ -n "$password" ]; then echo "::add-mask::$password"; fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "LandMs ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: "インストーラーは下の Assets から。既にインストール済みの LandMs はアプリ内の通知から更新できます。"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
