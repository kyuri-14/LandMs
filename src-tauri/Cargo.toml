[package]
name = "landms"
version = "0.3.0"
description = "LandMs — visual layout editor for Foling modules"
authors = ["LandMs contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/kyuri-14/LandMs"
edition = "2021"

[lib]
name = "landms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tiny_http = "0.12"
